<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محلل الشطرنج التفاعلي - MatePad Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #161512;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            min-height: 100vh;
        }
        /* منطقة الرقعة وشريط التقييم */
        .board-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .eval-bar-wrapper {
            width: 24px;
            height: min(82vw, 460px);
            background: #2b2926;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .eval-bar-fill {
            width: 100%;
            height: 50%;
            background: #f0f0f0;
            transition: height 0.4s ease;
        }
        .eval-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            z-index: 2;
            padding: 4px 0;
        }
        .eval-top { top: 2px; color: #fff; }
        .eval-bottom { bottom: 2px; color: #111; }

        .board-wrapper {
            position: relative;
            width: min(82vw, 460px);
            height: min(82vw, 460px);
            touch-action: none; /* مهم جداً لمنع تحرك الشاشة أثناء سحب القطع على التابلت */
        }
        #board { width: 100%; height: 100%; }
        #arrow-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* لوحة التحكم والتحليل */
        .panel {
            width: min(92vw, 420px);
            background: #262421;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .box {
            background: #302e2b;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #3d3b38;
        }
        .box-title {
            font-size: 0.85em;
            color: #9e9e9e;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .engine-lines {
            font-family: monospace;
            font-size: 0.9em;
            direction: ltr;
            text-align: left;
            line-height: 1.5;
            color: #a5d6a7;
        }
        .move-quality {
            font-weight: bold;
            font-size: 1em;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            background: #222;
        }
        .q-best { color: #81c784; border-right: 4px solid #4caf50; }
        .q-good { color: #aed581; border-right: 4px solid #8bc34a; }
        .q-inaccuracy { color: #fff176; border-right: 4px solid #fbc02d; }
        .q-mistake { color: #ffb74d; border-right: 4px solid #ff9800; }
        .q-blunder { color: #e57373; border-right: 4px solid #f44336; }

        .pgn-box {
            height: 110px;
            overflow-y: auto;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            font-size: 0.95em;
            line-height: 1.6;
            color: #ddd;
            background: #1e1d1a;
            padding: 8px;
            border-radius: 4px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        button {
            padding: 10px 6px;
            background: #3692e7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            touch-action: manipulation;
        }
        button:active { opacity: 0.8; }
        button.secondary { background: #45423e; }
        button.success { background: #4caf50; }
        textarea {
            width: 100%;
            height: 55px;
            background: #1e1d1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px;
            font-family: monospace;
            direction: ltr;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="board-container">
        <div class="eval-bar-wrapper">
            <div id="eval-top" class="eval-text eval-top"></div>
            <div id="eval-fill" class="eval-bar-fill"></div>
            <div id="eval-bottom" class="eval-text eval-bottom">0.0</div>
        </div>

        <div class="board-wrapper">
            <div id="board"></div>
            <svg id="arrow-layer" viewBox="0 0 480 480">
                <defs>
                    <marker id="arrowhead" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto">
                        <polygon points="0 0, 4 2, 0 4" fill="rgba(76, 175, 80, 0.85)" />
                    </marker>
                </defs>
                <line id="best-arrow" x1="0" y1="0" x2="0" y2="0" stroke="rgba(76, 175, 80, 0.85)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowhead)" style="display:none;" />
            </svg>
        </div>
    </div>

    <div class="panel">
        <div class="box">
            <div class="box-title">
                <span>تقييم النقلة الأخيرة</span>
                <span id="engine-status" style="color: #ffb74d;">⏳ جاري تحميل المحرك...</span>
            </div>
            <div id="move-quality" class="move-quality">ابدأ اللعب للتحليل الفوري</div>
        </div>

        <div class="box">
            <div class="box-title">
                <span>أفضل الردود المقترحة (Runtime)</span>
                <span id="depth-info">Depth: 0</span>
            </div>
            <div id="engine-lines" class="engine-lines">في انتظار التحليل...</div>
        </div>

        <div class="box">
            <div class="box-title"><span>سجل النقلات (PGN Notation)</span></div>
            <div id="pgn-display" class="pgn-box"></div>
            
            <div class="controls" style="margin-top: 8px;">
                <button class="secondary" onclick="goToMove(0)">⏮</button>
                <button class="secondary" onclick="prevMove()">◀</button>
                <button class="secondary" onclick="nextMove()">▶</button>
                <button class="secondary" onclick="goToMove(historyMoves.length)">⏭</button>
            </div>
        </div>

        <div class="actions">
            <button class="success" onclick="downloadPGN()">💾 حفظ Text</button>
            <button class="secondary" onclick="flipBoard()">🔄 قلب الرقعة</button>
            <button class="secondary" onclick="resetGame()">🆕 دور جديد</button>
        </div>

        <div class="box">
            <div class="box-title"><span>استيراد مباراة (الصق PGN هنا)</span></div>
            <textarea id="pgn-input" placeholder="1. e4 e5 2. Nf3 Nc6 ..."></textarea>
            <button style="width: 100%; margin-top: 6px;" onclick="loadPGN()">تحميل وتحليل المباراة</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let stockfish = null;
        let historyMoves = [];
        let currentMoveIndex = 0;
        let currentEval = 0.0;
        let pvLines = {};
        let lastBestMove = '';

        // 1. تشغيل Stockfish في الخلفية
        fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
            .then(res => res.text())
            .then(code => {
                const blob = new Blob([code], { type: 'application/javascript' });
                stockfish = new Worker(URL.createObjectURL(blob));
                
                stockfish.postMessage('uci');
                stockfish.postMessage('setoption name MultiPV value 3');

                stockfish.onmessage = function(event) {
                    parseEngineOutput(event.data);
                };

                document.getElementById('engine-status').innerText = '● المحرك جاهز';
                document.getElementById('engine-status').style.color = '#4caf50';
                startRuntimeAnalysis();
            });

        function parseEngineOutput(line) {
            if (line.includes('info depth') && line.includes('pv')) {
                const depthMatch = line.match(/depth (\d+)/);
                const multipvMatch = line.match(/multipv (\d+)/);
                const scoreCpMatch = line.match(/score cp (-?\d+)/);
                const scoreMateMatch = line.match(/score mate (-?\d+)/);
                const pvMatch = line.match(/ pv (.+)/);

                if (depthMatch && pvMatch) {
                    const depth = depthMatch[1];
                    const lineNum = multipvMatch ? multipvMatch[1] : '1';
                    const moves = pvMatch[1].split(' ').slice(0, 5).join(' ');
                    
                    let scoreText = '';
                    let numericEval = 0;

                    if (scoreCpMatch) {
                        let cp = parseInt(scoreCpMatch[1]) / 100;
                        if (game.turn() === 'b') cp = -cp;
                        numericEval = cp;
                        scoreText = (cp > 0 ? '+' : '') + cp.toFixed(2);
                    } else if (scoreMateMatch) {
                        let mate = parseInt(scoreMateMatch[1]);
                        if (game.turn() === 'b') mate = -mate;
                        numericEval = mate > 0 ? 100 : -100;
                        scoreText = 'M' + Math.abs(mate);
                    }

                    pvLines[lineNum] = `<b>[${scoreText}]</b> ${moves}`;
                    document.getElementById('depth-info').innerText = `Depth: ${depth}`;

                    if (lineNum === '1') {
                        currentEval = numericEval;
                        updateEvalBar(numericEval, scoreText);
                        lastBestMove = pvMatch[1].split(' ')[0];
                        drawArrow(lastBestMove);
                    }

                    let html = '';
                    for (let i = 1; i <= 3; i++) {
                        if (pvLines[i]) html += `<div>${i}. ${pvLines[i]}</div>`;
                    }
                    document.getElementById('engine-lines').innerHTML = html;
                }
            }
        }

        function startRuntimeAnalysis() {
            if (!stockfish) return;
            pvLines = {};
            stockfish.postMessage('stop');
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 15');
        }

        function evaluateMoveQuality(prevEval, newEval, playerColor) {
            let evalDiff = (playerColor === 'w') ? (newEval - prevEval) : (prevEval - newEval);
            const qBox = document.getElementById('move-quality');
            qBox.className = 'move-quality';

            if (evalDiff >= -0.2) {
                qBox.innerText = '⭐ نقلة ممتازة / الأفضل (Best Move)';
                qBox.classList.add('q-best');
            } else if (evalDiff >= -0.6) {
                qBox.innerText = '👍 نقلة جيدة (Good)';
                qBox.classList.add('q-good');
            } else if (evalDiff >= -1.2) {
                qBox.innerText = '⁉️ عدم دقة (Inaccuracy ?!)';
                qBox.classList.add('q-inaccuracy');
            } else if (evalDiff >= -2.5) {
                qBox.innerText = '⚠️ خطأ (Mistake ?)';
                qBox.classList.add('q-mistake');
            } else {
                qBox.innerText = '❌ خطأ فادح (Blunder ??)';
                qBox.classList.add('q-blunder');
            }
        }

        function updateEvalBar(evalNum, text) {
            let percent = 50 + (evalNum * 5);
            percent = Math.max(5, Math.min(95, percent));
            document.getElementById('eval-fill').style.height = percent + '%';
            
            if (evalNum >= 0) {
                document.getElementById('eval-bottom').innerText = text;
                document.getElementById('eval-top').innerText = '';
            } else {
                document.getElementById('eval-top').innerText = text;
                document.getElementById('eval-bottom').innerText = '';
            }
        }

        function drawArrow(move) {
            const arrow = document.getElementById('best-arrow');
            if (!move || move.length < 4) {
                arrow.style.display = 'none';
                return;
            }
            const files = 'abcdefgh';
            const isFlipped = board.orientation() === 'black';

            let fromCol = files.indexOf(move[0]);
            let fromRow = 8 - parseInt(move[1]);
            let toCol = files.indexOf(move[2]);
            let toRow = 8 - parseInt(move[3]);

            if (isFlipped) {
                fromCol = 7 - fromCol;
                fromRow = 7 - fromRow;
                toCol = 7 - toCol;
                toRow = 7 - toRow;
            }

            const sqSize = 480 / 8;
            arrow.setAttribute('x1', fromCol * sqSize + sqSize / 2);
            arrow.setAttribute('y1', fromRow * sqSize + sqSize / 2);
            arrow.setAttribute('x2', toCol * sqSize + sqSize / 2);
            arrow.setAttribute('y2', toRow * sqSize + sqSize / 2);
            arrow.style.display = 'block';
        }

        function onDragStart(source, piece) {
            if (game.game_over()) return false;
        }

        function onDrop(source, target) {
            const playerColor = game.turn();
            const prevEval = currentEval;

            if (currentMoveIndex < historyMoves.length) {
                historyMoves = historyMoves.slice(0, currentMoveIndex);
            }

            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            historyMoves.push(move);
            currentMoveIndex = historyMoves.length;
            updatePGNDisplay();
            startRuntimeAnalysis();

            setTimeout(() => {
                evaluateMoveQuality(prevEval, currentEval, playerColor);
            }, 600);
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function goToMove(index) {
            game.reset();
            for (let i = 0; i < index; i++) {
                game.move(historyMoves[i]);
            }
            currentMoveIndex = index;
            board.position(game.fen());
            updatePGNDisplay();
            startRuntimeAnalysis();
        }
        function prevMove() { if (currentMoveIndex > 0) goToMove(currentMoveIndex - 1); }
        function nextMove() { if (currentMoveIndex < historyMoves.length) goToMove(currentMoveIndex + 1); }

        function flipBoard() {
            board.flip();
            drawArrow(lastBestMove);
        }

        function updatePGNDisplay() {
            document.getElementById('pgn-display').innerText = game.pgn() || 'لم تبدأ المباراة بعد...';
        }

        function downloadPGN() {
            const pgnText = game.pgn();
            if (!pgnText) {
                alert('لا توجد نقلات لحفظها!');
                return;
            }
            const date = new Date().toISOString().slice(0, 10);
            const header = `[Event "تحليل شطرنج"]\n[Date "${date}"]\n[Result "${game.in_checkmate() ? (game.turn() === 'w' ? '0-1' : '1-0') : '*'}"]\n\n`;
            const fullContent = header + pgnText;

            const blob = new Blob([fullContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `chess_game_${date}.txt`;
            link.click();
        }

        function loadPGN() {
            const pgnInput = document.getElementById('pgn-input').value.trim();
            if (!pgnInput) return;

            const tempGame = new Chess();
            if (tempGame.load_pgn(pgnInput)) {
                historyMoves = tempGame.history({ verbose: true });
                goToMove(0);
                document.getElementById('move-quality').innerText = 'تم تحميل المباراة! استخدم الأسهم للتنقل';
            } else {
                alert('صيغة PGN غير صحيحة، تأكد من النص.');
            }
        }

        function resetGame() {
            game.reset();
            historyMoves = [];
            currentMoveIndex = 0;
            board.start();
            updatePGNDisplay();
            document.getElementById('move-quality').innerText = 'دور جديد - ابدأ اللعب';
            document.getElementById('move-quality').className = 'move-quality';
            startRuntimeAnalysis();
        }

        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        });

        window.addEventListener('resize', () => {
            board.resize();
            drawArrow(lastBestMove);
        });
    </script>
</body>
</html>
